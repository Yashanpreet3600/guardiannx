# Keep your own `name:` line from the old pubspec if it was different.
# All imports in lib/ are relative, so the package name doesn't matter.
name: guardianx
description: GuardianX - personal safety app.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend: auth, database, storage, edge functions
  supabase_flutter: ^2.8.0

  # Local storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5

  # Phone features
  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9
  another_telephony: ^0.4.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # Phase 3: SOS
  geolocator: ^13.0.1
  battery_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Keep your existing assets list here (siren sound, models, images).
  # assets:
  #   - assets/
